name: CI/CD Pipeline

on:

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  deploy:

    if: github.event_name == 'workflow_dispatch'

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=vcp_8O5KLXAkYUCuoQJxmuHnHUspqAV9zF5uofOuuuFF09XYjChhVB3i6Laj

      - name: Build Project
        run: vercel build --prod --token=vcp_8O5KLXAkYUCuoQJxmuHnHUspqAV9zF5uofOuuuFF09XYjChhVB3i6Laj

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=vcp_8O5KLXAkYUCuoQJxmuHnHUspqAV9zF5uofOuuuFF09XYjChhVB3i6Laj